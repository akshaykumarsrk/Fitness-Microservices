
# cloud server configuration
# we are telling user-service to communicate config server and fetch it & use it
#spring.config.import=optional:configserver:http://localhost:8888

spring.application.name=gateway-service
server.port=${PORT:8080}

eureka.client.service-url.defaultZone=https://akshay-fitness-eureka.onrender.com/eureka

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=https://akshay-fitness-userservice.onrender.com
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.routes[1].id=activity-service
spring.cloud.gateway.routes[1].uri=https://akshay-fitness-activityservice.onrender.com
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/activities/**

spring.cloud.gateway.routes[2].id=product-service
spring.cloud.gateway.routes[2].uri=https://akshay-fitness-aiservice.onrender.com
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/recommendations/**

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://akshay-fitness-keycloak.onrender.com/realms/fitness-app/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://akshay-fitness-keycloak.onrender.com/realms/fitness-app
spring.cloud.config.enabled=false


#spring.config.import=optional:configserver:https://akshay-fitness-configservers.onrender.com

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=https://ai-fitness-tracker-frontend.vercel.app
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

spring.cloud.config.fail-fast=true
spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.multiplier=1.5
spring.cloud.config.retry.max-interval=10000